[package]
name = "llm-router"
version = "0.1.0"
description = "LLM Router — 本地 AI 网关桌面应用"
authors = ["TouTou"]
edition = "2024"

[lib]
# `_lib` 后缀用于避免与 bin 名冲突（Windows 上 cargo 的已知问题）。
name = "llm_router_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 原生文件选择对话框（T15：导入 HAR 需要用户挑本地 HAR 文件）
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 网关 HTTP 服务（02 §1.3 技术选型，已锁定）
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
thiserror = "2.0.21"

# ── 加密保险库（02 §5）──
# AES-256-GCM：加密每条凭据（RustCrypto）
aes-gcm = "0.10"
# Argon2id：可选的主密码模式派生 KEK
argon2 = "0.5"
# 敏感内存零化
zeroize = { version = "1.9.2", features = ["derive"] }
# 随机数（主密钥 / nonce）
rand = "0.9"
# vault.bin 字段的 base64 编解码
base64 = "0.23"
# client key 的 SHA-256 哈希（02 §3.1：只存哈希，不存明文）
sha2 = "0.10"
async-trait = "0.1.92"
# 出站 HTTP 客户端（02 §1.3 技术选型，已锁定）
# 不用 default-features：native-tls 需要系统 OpenSSL；rustls 纯 Rust 且本地缓存齐全。
# 不开 http2：本地 cargo 缓存无 h2 crate，HTTP/1.1 足够各 OpenAI 兼容上游。
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
# 流式管道：Stream 组合（stream.rs 的逐帧转发与错误收尾）
futures-util = "0.3"
bytes = "1"
tiktoken-rs = "0.12.1"

# Windows DPAPI（主密钥由 OS 原生保护，绑定当前用户）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

# macOS Keychain（主密钥由 OS 原生保护）
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3.27.0"
# tower::util::ServiceExt::oneshot 用于在单测里直接调用 axum Router
tower = { version = "0.5", features = ["util"] }
# BodyExt::frame() 用于逐帧读取流式响应（验证零缓冲与断连取消）
http-body-util = "0.1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
