[package]
name = "llm-router"
version = "0.1.0"
description = "LLM Router — 本地 AI 网关桌面应用"
authors = ["TouTou"]
edition = "2024"

[lib]
# `_lib` 后缀用于避免与 bin 名冲突（Windows 上 cargo 的已知问题）。
name = "llm_router_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 网关 HTTP 服务（02 §1.3 技术选型，已锁定）
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }

[dev-dependencies]
# tower::util::ServiceExt::oneshot 用于在单测里直接调用 axum Router
tower = { version = "0.5", features = ["util"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
